<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>404 — Aneek Mukherjee</title>
    <meta name="robots" content="noindex">
    <style>
      :root {
        --paper: #f4efe5;
        --ink: #2a241d;
        --muted: #6f6558;
        --title: #88001a;
        --accent: #24436e;
        --gold: #a8843c;
      }
      [data-theme="dark"] {
        --paper: #16120d;
        --ink: #ece0cc;
        --muted: #a8947b;
        --title: #f0e5d0;
        --accent: #1789b7;
        --gold: #d4b26a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Newsreader", Georgia, serif;
        color: var(--ink);
        background-color: var(--paper);
        background-image: radial-gradient(circle at center, rgba(42,36,29,0.05) 1px, transparent 1px);
        background-size: 26px 26px;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 1.4rem;
      }
      [data-theme="dark"] body { background-image: radial-gradient(circle at center, rgba(236,227,212,0.05) 1px, transparent 1px); }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 500;
        font-size: clamp(2.4rem, 8vw, 4rem);
        color: var(--title);
        margin-bottom: 0.6rem;
      }
      p { color: var(--muted); font-size: 1.1rem; margin-bottom: 1.6rem; }
      a {
        font-family: "Fraunces", Georgia, serif;
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid var(--accent);
        padding-bottom: 1px;
      }
      a:hover { opacity: 0.8; }
      .eyebrow {
        font-family: "Fraunces", Georgia, serif;
        font-size: 0.72rem;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div>
      <p class="eyebrow">Aneek Mukherjee</p>
      <h1>Lost in the stacks.</h1>
      <p>That page isn&rsquo;t here &mdash; but the good stuff is.</p>
      <a href="/">back to the front page</a>
    </div>
  </body>
</html>
